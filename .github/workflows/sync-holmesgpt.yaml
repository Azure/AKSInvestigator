name: Sync HolmesGPT chart

# Pull the latest upstream HolmesGPT Helm chart into ./helm and open a PR
# when a new upstream release is cut. Triggered manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream release tag to sync, e.g. 0.36.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: robusta-dev/holmesgpt

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AKSInvestigator
        uses: actions/checkout@v4

      - name: Resolve upstream ref
        id: upstream
        run: |
          set -euo pipefail
          REF="${{ inputs.ref }}"
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"
          echo "Upstream ref: ${REF}"

      - name: Check whether already synced
        id: check
        run: |
          set -euo pipefail
          REF="${{ steps.upstream.outputs.ref }}"
          CURRENT=""
          [[ -f .upstream-version ]] && CURRENT="$(cat .upstream-version)"
          echo "Current: '${CURRENT}'  Upstream: '${REF}'"
          if [[ "${CURRENT}" == "${REF}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Fetch upstream chart
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          REF="${{ steps.upstream.outputs.ref }}"
          mkdir -p /tmp/holmesgpt
          git clone --depth 1 --branch "${REF}" \
            "https://github.com/${UPSTREAM_REPO}.git" /tmp/holmesgpt

      - name: Run sync
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          HOLMESGPT_DIR=/tmp/holmesgpt ./scripts/sync.sh
          echo "${{ steps.upstream.outputs.ref }}" > .upstream-version

      - name: Create pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(helm): sync HolmesGPT chart to ${{ steps.upstream.outputs.ref }}"
          branch: "sync/holmesgpt-${{ steps.upstream.outputs.ref }}"
          delete-branch: true
          title: "chore(helm): sync HolmesGPT chart to ${{ steps.upstream.outputs.ref }}"
          body: |
            Automated sync of the upstream [HolmesGPT](https://github.com/${{ env.UPSTREAM_REPO }})
            Helm chart to **${{ steps.upstream.outputs.ref }}**.

            - Source: `${{ env.UPSTREAM_REPO }}@${{ steps.upstream.outputs.ref }}`
            - Generated by `.github/workflows/sync-holmesgpt.yaml` via `scripts/sync.sh`

            AKSInvestigator-only files (`helm/templates/saturn/`, `helm/values-saturn.yaml`)
            are preserved by `scripts/sync.sh`. Please review the diff before merging.
          labels: |
            automated
            dependencies

  # Mirror the upstream HolmesGPT image into the AKS ACR at sync time. We do not
  # build the image ourselves (no HolmesGPT source in this repo) — we mirror the
  # upstream image from Docker Hub (robustadev/holmes) into the ACR, keyed on the
  # upstream tag. The Helm chart is NOT published here: that happens only after
  # the sync PR is merged and an AKS Investigator release tag is pushed — see
  # .github/workflows/release.yaml.
  mirror-image:
    runs-on: [self-hosted, e2e]
    steps:
      - name: Checkout AKSInvestigator
        uses: actions/checkout@v4

      - name: Log in to Azure (runner managed identity)
        run: az login --identity

      - name: Log in to ACR
        run: az acr login --name "${{ secrets.AZURE_CONTAINER_REGISTRY }}"

      - name: Mirror HolmesGPT image from Docker Hub to ACR
        run: |
          set -euo pipefail
          REF="${{ inputs.ref }}"
          ACR="${{ secrets.AZURE_CONTAINER_REGISTRY }}"
          SRC="robustadev/holmes:${REF}"
          DST="${ACR}.azurecr.io/holmes:${REF}"
          echo "Mirroring ${SRC} -> ${DST}"
          docker pull "${SRC}"
          docker tag "${SRC}" "${DST}"
          docker push "${DST}"

