name: Build and check kubectl plugin binaries

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-binary:
    name: Native plugin (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          suffix: ""
        - runner: windows-2022
          suffix: .exe
        - runner: macos-15
          suffix: ""
    # Untrusted PRs run only on disposable GitHub-hosted runners, without Azure secrets.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: kubectl-plugin
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.24.x'
        cache-dependency-path: kubectl-plugin/go.sum

    - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      with:
        version: v1.34.1

    - name: Check formatting and static analysis
      run: |
        set -euo pipefail
        files=(main.go exec_unix.go exec_windows.go tools/check-binary/main.go)
        unformatted="$(gofmt -l "${files[@]}")"
        if [[ -n "${unformatted}" ]]; then
          echo '::error::Go files are not gofmt-formatted (LF line endings required).'
          printf '%s\n' "${unformatted}"
          gofmt -d "${files[@]}"
          exit 1
        fi
        go mod verify
        go vet ./...

    - name: Build native plugin
      id: platform
      env:
        CGO_ENABLED: '0'
      run: |
        set -euo pipefail
        echo "goos=$(go env GOOS)" >> "${GITHUB_OUTPUT}"
        echo "goarch=$(go env GOARCH)" >> "${GITHUB_OUTPUT}"
        go build -mod=readonly -trimpath -o "bin/host/kubectl-investigate${{ matrix.suffix }}" .

    - name: Exercise compiled binary and real kubectl dispatch
      run: |
        set -euo pipefail
        go run -mod=readonly ./tools/check-binary \
          --binary "bin/host/kubectl-investigate${{ matrix.suffix }}" \
          --kubectl kubectl

    - name: Verify PowerShell can launch the Windows executable
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $output = & ./bin/host/kubectl-investigate.exe --help
        if ($LASTEXITCODE -ne 0 -or "$output" -notmatch 'Usage:') {
          throw 'Native plugin invocation from PowerShell failed'
        }
        exit 0

    - name: Upload tested binary and checksum
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: kubectl-investigate-${{ steps.platform.outputs.goos }}-${{ steps.platform.outputs.goarch }}
        path: kubectl-plugin/bin/host/
        if-no-files-found: error
        retention-days: 14