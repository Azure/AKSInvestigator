name: Publish Saturn model to MCR

run-name: >-
  Publish Saturn model ${{ inputs.revision }} — artifact ${{ inputs.tag }}, image ${{ inputs.image_tag }}

# AIKit downloads the resolved model once into a local ModelPack OCI layout.
# Publish that artifact AND a runnable model-only image built from its files.
# ORAS is used only by this publishing job when the chart uses modelSource=image.
#
# ACR: <acr>.azurecr.io/public/microsoft.aks.investigator/saturn:<artifact-tag>
#      <acr>.azurecr.io/public/microsoft.aks.investigator/saturn:<image-tag>
# MCR: mcr.microsoft.com/microsoft.aks.investigator/saturn:<artifact-tag>
#      mcr.microsoft.com/microsoft.aks.investigator/saturn:<image-tag>
# Initial mapping: model image 0.1.0 contains artifact v1-20260202's model.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Hugging Face branch, tag, or commit to publish"
        required: true
        default: main
        type: string
      tag:
        description: "ModelPack OCI artifact tag. A sha-<commit> tag is also published."
        required: false
        default: "v1-20260202"
        type: string
      image_tag:
        description: "Model image version. 0.1.0 corresponds to artifact v1-20260202. An image-sha-<commit> tag is also published."
        required: false
        default: "0.1.0"
        type: string

permissions:
  contents: read

env:
  AIKIT_IMAGE: ghcr.io/kaito-project/aikit/aikit:latest
  HF_MODEL: saturn-ms/saturn-0202
  MODEL_NAME: saturn-0202
  DST_REPO: public/microsoft.aks.investigator/saturn
  MCR_REPO: microsoft.aks.investigator/saturn

jobs:
  publish-model:
    runs-on: [ "self-hosted", "1ES.Pool=1es-aks-investigator-pool-ubuntu" ]
    steps:
    - name: Checkout AKSInvestigator
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up ORAS
      uses: oras-project/setup-oras@v1

    - name: Resolve immutable model revision
      id: model
      env:
        REVISION: ${{ inputs.revision }}
        FRIENDLY_TAG: ${{ inputs.tag }}
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        set -euo pipefail

        metadata_url="https://huggingface.co/api/models/${HF_MODEL}/revision/${REVISION}"
        sha="$(curl -fsSL --retry 3 "${metadata_url}" | jq -r '.sha')"
        if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::could not resolve ${HF_MODEL}@${REVISION} to a commit SHA"
          exit 1
        fi

        if [[ -n "${FRIENDLY_TAG}" && ! "${FRIENDLY_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
          echo "::error::invalid OCI tag: ${FRIENDLY_TAG}"
          exit 1
        fi
        if [[ -n "${IMAGE_TAG}" && ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
          echo "::error::invalid model image tag: ${IMAGE_TAG}"
          exit 1
        fi
        # Both formats share one repository; never publish them to one tag.
        if [[ -n "${FRIENDLY_TAG}" && "${FRIENDLY_TAG}" == "${IMAGE_TAG}" ]]; then
          echo "::error::artifact and image release tags must differ"
          exit 1
        fi
        if [[ "${FRIENDLY_TAG}" == image-sha-* || "${IMAGE_TAG}" == sha-* ]]; then
          echo "::error::sha-* is reserved for artifacts; image-sha-* is reserved for images"
          exit 1
        fi

        immutable_tag="sha-${sha:0:12}"
        immutable_image_tag="image-sha-${sha:0:12}"
        echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
        echo "immutable_tag=${immutable_tag}" >> "${GITHUB_OUTPUT}"
        echo "immutable_image_tag=${immutable_image_tag}" >> "${GITHUB_OUTPUT}"
        echo "Resolved ${HF_MODEL}@${REVISION} to ${sha}"

    - name: Package model as a ModelPack OCI artifact
      env:
        MODEL_SHA: ${{ steps.model.outputs.sha }}
      run: |
        set -euo pipefail
        OCI_DIR="${RUNNER_TEMP}/saturn-model"
        rm -rf "${OCI_DIR}"

        printf '' | docker buildx build \
          --build-arg "BUILDKIT_SYNTAX=${AIKIT_IMAGE}" \
          --target packager/modelpack \
          --build-arg "source=huggingface://${HF_MODEL}@${MODEL_SHA}" \
          --build-arg "name=${MODEL_NAME}" \
          --build-arg "layer_packaging=raw" \
          --output "${OCI_DIR}" \
          -

        test -f "${OCI_DIR}/layout/index.json"

    - name: Prepare model image from the local ModelPack
      run: |
        set -euo pipefail
        image_context="${RUNNER_TEMP}/saturn-model-image"
        rm -rf "${image_context}"
        mkdir -p "${image_context}/model"

        # Read from disk, not the registry or Hugging Face a second time.
        oras pull --oci-layout "${RUNNER_TEMP}/saturn-model/layout:${MODEL_NAME}" \
          --output "${image_context}/model"
        test -s "${image_context}/model/config.json"
        test -s "${image_context}/model/model.safetensors.index.json"
        # Fail before publication if the index references an absent/empty shard.
        shards="$(jq -er '.weight_map | select(type == "object" and length > 0) | .[]' \
          "${image_context}/model/model.safetensors.index.json")"
        while IFS= read -r shard; do
          [[ "${shard}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.safetensors$ ]]
          test -s "${image_context}/model/${shard}"
        done < <(printf '%s\n' "${shards}" | sort -u)

    - name: Log in to Azure and ACR
      env:
        ACR: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
      run: |
        set -euo pipefail
        az login --identity
        az acr login --name "${ACR}"

    - name: Publish model artifact
      env:
        ACR: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
        FRIENDLY_TAG: ${{ inputs.tag }}
        IMMUTABLE_TAG: ${{ steps.model.outputs.immutable_tag }}
      run: |
        set -euo pipefail
        source_ref="${RUNNER_TEMP}/saturn-model/layout:${MODEL_NAME}"
        registry="${ACR}.azurecr.io"
        immutable_ref="${registry}/${DST_REPO}:${IMMUTABLE_TAG}"

        oras cp --from-oci-layout "${source_ref}" "${immutable_ref}"
        oras manifest fetch "${immutable_ref}" >/dev/null
        echo "Published ${immutable_ref}"

        if [[ -n "${FRIENDLY_TAG}" && "${FRIENDLY_TAG}" != "${IMMUTABLE_TAG}" ]]; then
          friendly_ref="${registry}/${DST_REPO}:${FRIENDLY_TAG}"
          oras cp "${immutable_ref}" "${friendly_ref}"
          oras manifest fetch "${friendly_ref}" >/dev/null
          echo "Published ${friendly_ref}"
        fi

        {
          echo "### Saturn ModelPack artifact"
          echo
          echo "- Model: \`${HF_MODEL}@${{ steps.model.outputs.sha }}\`"
          echo "- MCR: \`mcr.microsoft.com/${MCR_REPO}:${IMMUTABLE_TAG}\`"
          if [[ -n "${FRIENDLY_TAG}" ]]; then
            echo "- MCR alias: \`mcr.microsoft.com/${MCR_REPO}:${FRIENDLY_TAG}\`"
          fi
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Publish model container image
      env:
        ACR: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
        FRIENDLY_TAG: ${{ inputs.image_tag }}
        ARTIFACT_TAG: ${{ inputs.tag }}
        ARTIFACT_SHA_TAG: ${{ steps.model.outputs.immutable_tag }}
        IMMUTABLE_TAG: ${{ steps.model.outputs.immutable_image_tag }}
        MODEL_SHA: ${{ steps.model.outputs.sha }}
      run: |
        set -euo pipefail
        registry="${ACR}.azurecr.io"
        immutable_ref="${registry}/${DST_REPO}:${IMMUTABLE_TAG}"
        tags=(--tag "${immutable_ref}")
        if [[ -n "${FRIENDLY_TAG}" && "${FRIENDLY_TAG}" != "${IMMUTABLE_TAG}" ]]; then
          tags+=(--tag "${registry}/${DST_REPO}:${FRIENDLY_TAG}")
        fi

        # Model data + copy tools only, independent of CPU/GPU vLLM versions.
        # amd64 matches the chart's current x86 CPU and NVIDIA GPU pools.
        docker buildx build \
          --platform linux/amd64 \
          --file docker/saturn-model/Dockerfile \
          --build-arg "HF_MODEL=${HF_MODEL}" \
          --build-arg "MODEL_REVISION=${MODEL_SHA}" \
          --metadata-file "${RUNNER_TEMP}/saturn-model-image-metadata.json" \
          "${tags[@]}" --push "${RUNNER_TEMP}/saturn-model-image"

        oras manifest fetch "${immutable_ref}" >/dev/null
        if [[ -n "${FRIENDLY_TAG}" && "${FRIENDLY_TAG}" != "${IMMUTABLE_TAG}" ]]; then
          oras manifest fetch "${registry}/${DST_REPO}:${FRIENDLY_TAG}" >/dev/null
        fi
        digest="$(jq -er '.["containerimage.digest"]' \
          "${RUNNER_TEMP}/saturn-model-image-metadata.json")"
        {
          echo "### Saturn model container image"
          echo
          echo "- Model: \`${HF_MODEL}@${MODEL_SHA}\`"
          echo "- Release mapping: image \`${FRIENDLY_TAG:-${IMMUTABLE_TAG}}\` = artifact \`${ARTIFACT_TAG:-${ARTIFACT_SHA_TAG}}\` (same model revision)."
          echo "- Published ACR image: \`${immutable_ref}\`"
          echo "- Image digest: \`${digest}\`"
          echo "- Expected MCR image: \`mcr.microsoft.com/${MCR_REPO}:${IMMUTABLE_TAG}\`"
          if [[ -n "${FRIENDLY_TAG}" ]]; then
            echo "- Expected MCR alias: \`mcr.microsoft.com/${MCR_REPO}:${FRIENDLY_TAG}\`"
          fi
          echo "- Chart option: \`saturn.modelSource=image\` (no ORAS in the pod)."
          echo "- ACR push verification does not confirm MCR propagation. Verify the MCR image before deployment."
        } >> "${GITHUB_STEP_SUMMARY}"
