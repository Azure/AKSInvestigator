name: E2E Test - Package and Deploy Chart

on:
  pull_request:
    branches:
    - main
    paths:
    - helm/**
    - patches/**
    - scripts/sync.sh
    - UPSTREAM_VERSION
    - .github/workflows/e2e-test.yaml
    - .github/workflows/release.yaml
  workflow_call:
    inputs:
      location:
        description: Azure region for temporary resources
        required: false
        default: eastus
        type: string
    secrets:
      AZURE_CONTAINER_REGISTRY_E2E:
        description: Name of the persistent ACR used for E2E charts
        required: true
      RESOURCE_GROUP_E2E:
        description: Name of the persistent resource group used for E2E clusters
        required: true
  workflow_dispatch:
    inputs:
      location:
        description: Azure region for temporary resources
        required: false
        default: eastus
        type: string
      skip_cleanup:
        description: Retain temporary resources for debugging
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  LOCATION: ${{ inputs.location || 'eastus' }}
  ACR_NAME: ${{ secrets.AZURE_CONTAINER_REGISTRY_E2E }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP_E2E }}
  RELEASE_NAME: aksi-e2e
  NAMESPACE: aks-investigator-e2e

jobs:
  package-deploy-test:
    # Forked pull requests cannot be trusted with a self-hosted Azure runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [ "self-hosted", "e2e" ]
    timeout-minutes: 90

    steps:
    - name: Checkout AKSInvestigator
      uses: actions/checkout@v5

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Log in to Azure
      run: az login --identity

    - name: Verify E2E resource access
      run: |
        set -euo pipefail
        az acr show --name "${ACR_NAME}" --output none
        az acr login --name "${ACR_NAME}"
        az group show --name "${RESOURCE_GROUP}" --output none

    - name: Generate temporary resource names
      id: resources
      run: |
        set -euo pipefail
        UNIQUE_ID="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
        CLUSTER_NAME="aksi-e2e-${UNIQUE_ID}"
        CHART_VERSION="0.0.0-e2e.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
        echo "cluster_name=${CLUSTER_NAME}" >> "${GITHUB_OUTPUT}"
        echo "chart_version=${CHART_VERSION}" >> "${GITHUB_OUTPUT}"

    - name: Create temporary AKS cluster
      run: |
        set -euo pipefail
        az aks create \
          --resource-group "${RESOURCE_GROUP}" \
          --name "${{ steps.resources.outputs.cluster_name }}" \
          --location "${LOCATION}" \
          --node-count 1 \
          --node-vm-size Standard_D16s_v5 \
          --enable-managed-identity \
          --generate-ssh-keys \
          --output none

    - name: Package and publish chart to E2E ACR
      run: |
        set -euo pipefail
        VERSION="${{ steps.resources.outputs.chart_version }}"
        mkdir -p /tmp/chart
        helm dependency build ./helm
        helm package ./helm --version "${VERSION}" --app-version "e2e-${GITHUB_SHA::12}" -d /tmp/chart
        helm push "/tmp/chart/aks-investigator-chart-${VERSION}.tgz" "oci://${ACR_NAME}.azurecr.io/e2e"

    - name: Connect to AKS cluster
      run: |
        set -euo pipefail
        az aks get-credentials \
          --resource-group "${RESOURCE_GROUP}" \
          --name "${{ steps.resources.outputs.cluster_name }}" \
          --overwrite-existing
        kubectl cluster-info
        kubectl get nodes

    - name: Install published chart
      id: install
      run: |
        set -euo pipefail
        helm upgrade --install "${RELEASE_NAME}" \
          "oci://${ACR_NAME}.azurecr.io/e2e/aks-investigator-chart" \
          --version "${{ steps.resources.outputs.chart_version }}" \
          --namespace "${NAMESPACE}" \
          --create-namespace \
          --values ./helm/values-saturn.yaml \
          --set saturn.gpu=false \
          --wait \
          --timeout 30m

    - name: Verify chart deployment
      run: |
        set -euo pipefail
        kubectl rollout status deployment/${RELEASE_NAME}-holmes \
          --namespace "${NAMESPACE}" \
          --timeout 5m
        kubectl rollout status deployment/saturn-vllm \
          --namespace "${NAMESPACE}" \
          --timeout 5m
        kubectl get service/${RELEASE_NAME}-holmes --namespace "${NAMESPACE}"

    - name: Test with kubectl investigate
      run: |
        set -euo pipefail
        install -m 0755 kubectl-plugin/kubectl-investigate "${RUNNER_TEMP}/kubectl-investigate"
        export PATH="${RUNNER_TEMP}:${PATH}"
        kubectl plugin list | grep -F "${RUNNER_TEMP}/kubectl-investigate"
        HOLMES_NAMESPACE="${NAMESPACE}" HOLMES_RELEASE="${RELEASE_NAME}" \
          kubectl investigate "How many nodes are in this cluster?" --model saturn-vllm

    - name: Collect diagnostics
      if: failure() && steps.install.outcome != 'skipped'
      run: |
        helm status "${RELEASE_NAME}" --namespace "${NAMESPACE}" || true
        kubectl get all --namespace "${NAMESPACE}" -o wide || true
        kubectl describe pods --namespace "${NAMESPACE}" || true
        kubectl logs deployment/${RELEASE_NAME}-holmes --namespace "${NAMESPACE}" --all-containers --tail=200 || true
        kubectl get events --namespace "${NAMESPACE}" --sort-by=.lastTimestamp || true

    - name: Delete temporary resources
      if: always() && !(github.event_name == 'workflow_dispatch' && inputs.skip_cleanup)
      run: |
        az acr repository delete \
          --name "${ACR_NAME}" \
          --image "e2e/aks-investigator-chart:${{ steps.resources.outputs.chart_version }}" \
          --yes || true
        az aks delete \
          --resource-group "${RESOURCE_GROUP}" \
          --name "${{ steps.resources.outputs.cluster_name }}" \
          --yes \
          --no-wait || true
