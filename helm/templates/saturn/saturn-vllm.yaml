{{/*
Saturn vLLM model deployment.

Renders when .Values.saturn.enabled is true (default true in values.yaml),
independently of .Values.modelList. User-configured models may coexist.

The GPU vs CPU variant is selected by .Values.saturn.gpu (default: false).
Model files come from an init container image (modelSource=image, default)
or ORAS (modelSource=oci). Image mode needs no ORAS or model download in the pod.

Both variants serve an OpenAI-compatible API at /v1 on port 8000. The
in-cluster service DNS is:
  http://saturn-vllm.<release-namespace>.svc.cluster.local:8000/v1

Reference: see /home/azureuser/llm/holmesgpt/deploy/models/README.md
for the original standalone manifests this template is derived from.
*/}}
{{- with .Values.saturn -}}
{{- if .enabled -}}
{{- $gpu := .gpu | default false -}}
{{- $servedName := .servedModelName | default "saturn-vllm" -}}
{{- $modelPath := .modelPath | default "/models/saturn-0202" -}}
{{- $modelSource := .modelSource | default "image" -}}
{{- if not (has $modelSource (list "oci" "image")) -}}
{{- fail "saturn.modelSource must be oci or image" -}}
{{- end -}}
{{- $gpuImage := printf "%s:%s" (required "saturn.gpuImage.repository is required" .gpuImage.repository) (required "saturn.gpuImage.tag is required" .gpuImage.tag) -}}
{{- $cpuImage := printf "%s:%s" (required "saturn.cpuImage.repository is required" .cpuImage.repository) (required "saturn.cpuImage.tag is required" .cpuImage.tag) -}}
{{- $defaultMaxModelLen := ternary 262144 65536 $gpu -}}
{{- $variantMaxModelLen := ternary .gpuMaxModelLen .cpuMaxModelLen $gpu -}}
{{- $maxModelLen := .maxModelLen | default $variantMaxModelLen | default $defaultMaxModelLen -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saturn-vllm
  namespace: {{ $.Release.Namespace }}
  labels:
    app: saturn-vllm
    app.kubernetes.io/component: saturn-model
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    {{- include "holmes.commonLabels" $ | nindent 4 }}
spec:
  replicas: {{ .replicas | default 1 }}
  selector:
    matchLabels:
      app: saturn-vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: saturn-vllm
        app.kubernetes.io/component: saturn-model
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if eq $modelSource "image" }}
        {{- $modelImage := .modelImage | default dict }}
        - name: copy-model
          image: {{ printf "%s:%s" (required "saturn.modelImage.repository is required in image mode" $modelImage.repository) (required "saturn.modelImage.tag is required in image mode" $modelImage.tag) | quote }}
          imagePullPolicy: IfNotPresent
          # The model image entrypoint copies /model into this shared volume.
          # Pass the destination as a literal argument, not shell code.
          args:
            - {{ $modelPath | quote }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        {{- else }}
        {{- $modelArtifact := .modelArtifact | default dict }}
        {{- $modelPullImage := .modelPullImage | default dict }}
        - name: pull-model
          image: {{ printf "%s:%s" (required "saturn.modelPullImage.repository is required" $modelPullImage.repository) (required "saturn.modelPullImage.tag is required" $modelPullImage.tag) | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - pull
            - {{ printf "%s:%s" (required "saturn.modelArtifact.repository is required" $modelArtifact.repository) (required "saturn.modelArtifact.tag is required" $modelArtifact.tag) | quote }}
            - --output
            - {{ $modelPath | quote }}
        {{- end }}
          volumeMounts:
            - name: model
              mountPath: /models
      containers:
        - name: vllm
          {{- if $gpu }}
          image: {{ $gpuImage | quote }}
          {{- else }}
          image: {{ $cpuImage | quote }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          args:
            - --model={{ $modelPath }}
            - --served-model-name={{ $servedName }}
            - --port=8000
            # Current saturn-0202 declares bfloat16, so auto selects BF16
            # on supported CPU/GPU backends. Recheck the resolved dtype if
            # changing the model or runtime; auto is not a speed benchmark.
            - --dtype=auto
            # ADDED vs vLLM defaults: enable native OpenAI tool_calls API.
            # Required for the HolmesGPT agentic loop to advance.
            - --enable-auto-tool-choice
            # ADDED: Qwen3/Hermes-style tool-tag parser. Lenient enough to
            # accept bare-JSON tool calls (saturn-0202 SFT defect: only the
            # closing </tool_call> tag is reliably emitted, no opener).
            - --tool-call-parser=hermes
            {{- if $gpu }}
            # GPU: use saturn-0202's native context limit from config.json.
            - --max-model-len={{ $maxModelLen }}
            - --gpu-memory-utilization={{ .gpuMemoryUtilization | default "0.90" }}
            {{- else }}
            # NOTE: no --device flag. The vllm-openai-cpu image auto-detects the
            # CPU platform. Passing --device=cpu on vLLM >=0.26.0 is parsed as
            # device_ids=['cpu'] and aborts with "Non-integer device ID 'cpu'".
            # CPU: use a smaller context than GPU to limit KV-cache demand.
            - --max-model-len={{ $maxModelLen }}
            {{- end }}
            {{- with .extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: HF_HOME
              value: /cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            {{- if not $gpu }}
            - name: VLLM_TARGET_DEVICE
              value: cpu
            # vLLM 0.26.0 Model Runner V2 hardcodes pin_memory=True for
            # structured outputs, which crashes with CPU-only PyTorch.
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "0"
            # Fixed CPU KV-cache pool in GiB; auto does not shrink this budget.
            # At BF16, one 65536-token Saturn sequence needs ~9 GiB of KV
            # data (~18 GiB at FP32). A 20 GiB pool retains concurrency
            # headroom even with no active requests. Keep it sized with
            # resources.cpu and cpuMaxModelLen, not gpu-memory-utilization.
            - name: VLLM_CPU_KVCACHE_SPACE
              value: {{ .cpuKvCacheSpace | default "20" | quote }}
            {{- end }}
            {{- with .extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- if $gpu }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 900
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 120
            successThreshold: 1
          {{- else }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 1
            failureThreshold: 240
            successThreshold: 1
          {{- end }}
          resources:
            {{- if $gpu }}
            requests:
              cpu: {{ .resources.gpu.requests.cpu | default "2" | quote }}
              memory: {{ .resources.gpu.requests.memory | default "8Gi" | quote }}
              nvidia.com/gpu: {{ .resources.gpu.requests.gpu | default "1" | quote }}
            limits:
              cpu: {{ .resources.gpu.limits.cpu | default "4" | quote }}
              memory: {{ .resources.gpu.limits.memory | default "16Gi" | quote }}
              nvidia.com/gpu: {{ .resources.gpu.limits.gpu | default "1" | quote }}
            {{- else }}
            # Retain the previous memory budgets with auto/BF16. They cover
            # weights, the configured KV pool and runtime overhead; validate
            # startup and loaded usage before lowering requests or limits.
            requests:
              cpu: {{ .resources.cpu.requests.cpu | default "6" | quote }}
              memory: {{ .resources.cpu.requests.memory | default "38Gi" | quote }}
            limits:
              cpu: {{ .resources.cpu.limits.cpu | default "8" | quote }}
              memory: {{ .resources.cpu.limits.memory | default "48Gi" | quote }}
            {{- end }}
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      {{- if .nodeSelector }}
      nodeSelector:
        {{- toYaml .nodeSelector | nindent 8 }}
      {{- else if $gpu }}
      nodeSelector:
        agentpool: gpu
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: model
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .shmSize | default "2Gi" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: saturn-vllm
  namespace: {{ $.Release.Namespace }}
  labels:
    app: saturn-vllm
    app.kubernetes.io/component: saturn-model
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    {{- include "holmes.commonLabels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: saturn-vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
{{- end }}
{{- end }}
